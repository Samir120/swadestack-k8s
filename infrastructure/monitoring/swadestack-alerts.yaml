apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: swadestack-alerts
  namespace: monitoring
  labels:
    release: monitoring

spec:
  groups:
    - name: swadestack.availability
      rules:
        - alert: SwadeStackProductionDown
          expr: probe_success{job="swadestack-production"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "SwadeStack production is down"
            description: "https://swadestack.com has failed HTTP probes for more than 2 minutes."

        - alert: SwadeStackStagingDown
          expr: probe_success{job="swadestack-staging"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "SwadeStack staging is down"
            description: "https://lab.swadestack.com has failed HTTP probes for more than 5 minutes."

    - name: swadestack.postgres
      rules:
        - alert: SwadeStackPostgresDown
          expr: pg_up{namespace=~"swadestack-(production|staging)"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "SwadeStack PostgreSQL is down"
            description: "PostgreSQL exporter reports pg_up=0 in namespace {{ $labels.namespace }}."

    - name: swadestack.tls
      rules:
        - alert: SwadeStackTLSExpiringSoon
          expr: (probe_ssl_earliest_cert_expiry - time()) < 14 * 24 * 60 * 60
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "SwadeStack TLS certificate expires soon"
            description: "TLS certificate for {{ $labels.instance }} expires in less than 14 days."

    - name: swadestack.storage
      rules:
        - alert: SwadeStackPVCUsageHigh
          expr: |
            (
              kubelet_volume_stats_used_bytes{
                namespace=~"swadestack-(production|staging)"
              }
              /
              kubelet_volume_stats_capacity_bytes{
                namespace=~"swadestack-(production|staging)"
              }
            ) > 0.85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "SwadeStack PVC usage is high"
            description: "PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} is above 85% usage."
