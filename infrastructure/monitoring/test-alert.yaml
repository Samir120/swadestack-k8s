apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: swadestack-test-alert
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: swadestack.test
      rules:
        - alert: SwadeStackAlertTest
          expr: vector(1)
          for: 1m
          labels:
            severity: warning
            namespace: monitoring
          annotations:
            summary: "SwadeStack monitoring test"
            description: "This is a temporary end-to-end Alertmanager email test."
