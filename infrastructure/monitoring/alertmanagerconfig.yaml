apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: swadestack-email
  namespace: monitoring
spec:
  route:
    receiver: swadestack-email
    groupBy:
      - alertname
      - namespace
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h

  receivers:
    - name: swadestack-email
      emailConfigs:
        - to: samiralami132@gmail.com
          from: info@swadestack.com
          smarthost: smtp-relay.brevo.com:587
          authUsername: a20e09001@smtp-brevo.com
          authPassword:
            name: alertmanager-smtp
            key: password
          requireTLS: true
          sendResolved: true
