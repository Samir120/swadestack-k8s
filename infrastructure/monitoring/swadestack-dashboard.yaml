apiVersion: v1
kind: ConfigMap
metadata:
  name: swadestack-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  swadestack-overview.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "type": "stat",
          "title": "Production HTTP",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "probe_success{job=\"swadestack-production\"}",
              "legendFormat": "Production"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN"
                    },
                    "1": {
                      "text": "UP"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto"
          }
        },
        {
          "type": "stat",
          "title": "Staging HTTP",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "targets": [
            {
              "expr": "probe_success{job=\"swadestack-staging\"}",
              "legendFormat": "Staging"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN"
                    },
                    "1": {
                      "text": "UP"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto"
          }
        },
        {
          "type": "stat",
          "title": "Production PostgreSQL",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "targets": [
            {
              "expr": "pg_up{namespace=\"swadestack-production\"}",
              "legendFormat": "PostgreSQL"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN"
                    },
                    "1": {
                      "text": "UP"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto"
          }
        },
        {
          "type": "stat",
          "title": "Staging PostgreSQL",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "expr": "pg_up{namespace=\"swadestack-staging\"}",
              "legendFormat": "PostgreSQL"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN"
                    },
                    "1": {
                      "text": "UP"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto"
          }
        },
        {
          "type": "stat",
          "title": "Firing SwadeStack Alerts",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 16,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(ALERTS{alertstate=\"firing\",alertname=~\"SwadeStack.*\"})",
              "legendFormat": "Alerts"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "timeseries",
          "title": "HTTP Response Time",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "expr": "probe_duration_seconds{job=~\"swadestack-(production|staging)\"}",
              "legendFormat": "{{job}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "PostgreSQL Connections",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "targets": [
            {
              "expr": "pg_stat_database_numbackends{datname=\"swadestack\",namespace=~\"swadestack-(production|staging)\"}",
              "legendFormat": "{{namespace}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "PostgreSQL Backup Age",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 13
          },
          "targets": [
            {
              "expr": "(time() - kube_cronjob_status_last_successful_time{namespace=\"swadestack-production\",cronjob=\"postgres-backup\"}) / 3600",
              "legendFormat": "PostgreSQL"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "h"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "title": "Uploads Backup Age",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 6,
            "y": 13
          },
          "targets": [
            {
              "expr": "(time() - kube_cronjob_status_last_successful_time{namespace=\"swadestack-production\",cronjob=\"uploads-backup\"}) / 3600",
              "legendFormat": "Uploads"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "h"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "timeseries",
          "title": "PVC Usage",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 13
          },
          "targets": [
            {
              "expr": "100 * kubelet_volume_stats_used_bytes{namespace=~\"swadestack-(production|staging)\"} / kubelet_volume_stats_capacity_bytes{namespace=~\"swadestack-(production|staging)\"}",
              "legendFormat": "{{namespace}} / {{persistentvolumeclaim}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            },
            "overrides": []
          }
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "swadestack",
        "kubernetes"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "SwadeStack Overview",
      "uid": "swadestack-overview",
      "version": 1
    }
