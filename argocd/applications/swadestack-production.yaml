apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: swadestack-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/Samir120/swadestack-k8s
    targetRevision: main
    path: apps/swadestack/overlays/production

  destination:
    server: https://kubernetes.default.svc
    namespace: swadestack-production

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
