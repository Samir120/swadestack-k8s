apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cloudflared
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Samir120/swadestack-k8s
    targetRevision: main
    path: infrastructure/cloudflared

  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflared

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
