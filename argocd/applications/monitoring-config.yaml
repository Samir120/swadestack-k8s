apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-config
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Samir120/swadestack-k8s
    targetRevision: main
    path: infrastructure/monitoring

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
