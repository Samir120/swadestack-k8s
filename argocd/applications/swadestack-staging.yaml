apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: swadestack-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  source:
    repoURL: https://github.com/Samir120/swadestack-k8s
    targetRevision: main
    path: apps/swadestack/overlays/staging

  destination:
    server: https://kubernetes.default.svc
    namespace: swadestack-staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
