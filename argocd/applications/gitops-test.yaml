apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: gitops-test
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Samir120/swadestack-k8s
    targetRevision: main
    path: apps/gitops-test/base

  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-test

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
