apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
spec:
  replicas: 1

  selector:
    matchLabels:
      app: portfolio

  template:
    metadata:
      labels:
        app: portfolio

    spec:
      containers:
        - name: portfolio
          image: ghcr.io/samir120/portfolio

          ports:
            - containerPort: 3000
              name: http

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          lifecycle:
            preStop:
              sleep:
                seconds: 5

          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 192Mi

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
            - name: route-cache
              mountPath: /app/.next/server/route-cache

      volumes:
        - name: next-cache
          emptyDir: {}
        - name: route-cache
          emptyDir: {}
