apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres-exporter

  template:
    metadata:
      labels:
        app: postgres-exporter

    spec:
      containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1

          ports:
            - name: metrics
              containerPort: 9187

          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: swadestack-secrets
                  key: DB_NAME

            - name: DATA_SOURCE_URI
              value: "postgres:5432/$(DB_NAME)?sslmode=disable"

            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: swadestack-secrets
                  key: DB_USER

            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: swadestack-secrets
                  key: DB_PASSWORD

          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  labels:
    app: postgres-exporter
spec:
  selector:
    app: postgres-exporter

  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-exporter
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: postgres-exporter

  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
